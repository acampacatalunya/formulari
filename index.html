<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accés restringit · ACAMPA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 48px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    .box img { height: 56px; margin-bottom: 18px; }
    h1 { color: #1a5276; font-size: 1.35rem; margin-bottom: 12px; }
    p { color: #555; line-height: 1.6; font-size: .95rem; }
    .contact {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e8e8e8;
      font-size: .85rem;
      color: #7f8c8d;
    }
    .contact a { color: #2980b9; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <img src="https://i.postimg.cc/0K95v8Lm/logo.png" alt="ACAMPA">
    <h1>🔒 Accés restringit</h1>
    <p>Aquesta pàgina no és accessible públicament.<br>
    Si necessites accedir a un formulari, sol·licita l'enllaç a l'equip d'ACAMPA.</p>
    <div class="contact">
      Contacte: <a href="mailto:info@acampa.cat">info@acampa.cat</a>
    </div>
  </div>
</body>
</html>
